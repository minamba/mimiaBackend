services:
  geekai-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: geekai-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD}

      # L EDITION EST ECRITE ICI, PARCE QUE SON DEFAUT N EST PAS CELUI QU ON VEUT.
      #
      # Sans MSSQL_PID, cette image demarre en Developer Edition : gratuite,
      # mais dont la licence interdit la production. Le serveur tourne bien en
      # Express aujourd hui (verifie le 10/09/2026 : « Express Edition
      # (64-bit) », 1,14 Go sur les 10 autorises, aucune fonctionnalite
      # Enterprise persistee) — mais rien dans ce fichier ne le garantissait.
      # Un conteneur recree a partir d ici serait reparti en Developer, sans
      # que rien ne le signale, et le produit se serait retrouve vendu sur une
      # licence qui ne le permet pas.
      #
      # Express plafonne a 10 Go par base. C est pour cela que l audio des
      # comprehensions orales a quitte la base pour le disque : a six cents
      # kilo-octets piece, il aurait mange ce plafond en quelques mois.
      MSSQL_PID: "Express"
    volumes:
      - sqldata:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      # L'API et l'IdentityServer migrent au démarrage : sans ce contrôle, ils
      # démarrent avant que SQL Server accepte les connexions et la migration échoue.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  identity:
    build:
      context: .
      dockerfile: SchoolWebApp.IdentityServer/Dockerfile
    container_name: schoolia-identity
    depends_on:
      geekai-sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
    volumes:
      # Le fichier de secrets est MONTÉ, pas copié dans l'image.
      # Une image contenant des secrets les expose à quiconque peut la lire :
      # `docker history`, un registre, ou n'importe qui ayant accès au démon.
      - ./SchoolWebApp.IdentityServer/appsettings.Production.json:/app/appsettings.Production.json:ro

      # Les certificats qui signent les jetons. MONTÉS eux aussi, jamais copiés
      # dans l'image — ils contiennent une clé privée.
      #
      # En lecture seule : le serveur n'a qu'à les lire. Un montage inscriptible
      # laisserait un processus compromis les remplacer par les siens, et signer
      # des jetons valides pour n'importe quel compte.
      #
      # Voir SchoolWebApp.IdentityServer/certificats/GENERER.md pour les créer.
      - ./SchoolWebApp.IdentityServer/certificats:/app/certificats:ro
    ports:
      - "5067:8080"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: SchoolWebApp/Dockerfile
    container_name: schoolia-api
    depends_on:
      geekai-sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
    volumes:
      - ./SchoolWebApp/appsettings.Production.json:/app/appsettings.Production.json:ro

      # L AUDIO DES ARCHIVES, HORS DE LA BASE.
      #
      # Mesure : six cents kilo-octets par comprehension orale. A mille eleves
      # faisant deux exercices par semaine, c est une cinquantaine de
      # giga-octets par an — dans une base qu il faudrait sauvegarder chaque
      # nuit et restaurer en bloc, alors que le son n a besoin d aucune de ces
      # garanties. Il vit donc ici, et la base n en garde que le chemin.
      #
      # CE VOLUME N A PAS BESOIN D ETRE SAUVEGARDE : chaque audio se regenere
      # depuis le texte du passage, qui lui est en base. Un worker efface les
      # fichiers passe quatre-vingt-dix jours.
      - audioarchives:/app/archives/audio
    ports:
      - "5066:8080"
    restart: unless-stopped

volumes:
  sqldata:
  audioarchives:
