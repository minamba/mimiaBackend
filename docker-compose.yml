services:
  geekai-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: geekai-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD}
    volumes:
      - sqldata:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      # L'API et l'IdentityServer migrent au démarrage : sans ce contrôle, ils
      # démarrent avant que SQL Server accepte les connexions et la migration échoue.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  identity:
    build:
      context: .
      dockerfile: SchoolWebApp.IdentityServer/Dockerfile
    container_name: schoolia-identity
    depends_on:
      geekai-sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
    volumes:
      # Le fichier de secrets est MONTÉ, pas copié dans l'image.
      # Une image contenant des secrets les expose à quiconque peut la lire :
      # `docker history`, un registre, ou n'importe qui ayant accès au démon.
      - ./SchoolWebApp.IdentityServer/appsettings.Production.json:/app/appsettings.Production.json:ro

      # Les certificats qui signent les jetons. MONTÉS eux aussi, jamais copiés
      # dans l'image — ils contiennent une clé privée.
      #
      # En lecture seule : le serveur n'a qu'à les lire. Un montage inscriptible
      # laisserait un processus compromis les remplacer par les siens, et signer
      # des jetons valides pour n'importe quel compte.
      #
      # Voir SchoolWebApp.IdentityServer/certificats/GENERER.md pour les créer.
      - ./SchoolWebApp.IdentityServer/certificats:/app/certificats:ro
    ports:
      - "5067:8080"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: SchoolWebApp/Dockerfile
    container_name: schoolia-api
    depends_on:
      geekai-sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
    volumes:
      - ./SchoolWebApp/appsettings.Production.json:/app/appsettings.Production.json:ro
    ports:
      - "5066:8080"
    restart: unless-stopped

volumes:
  sqldata:
