<h1 style="margin:0 0 6px 0; font-family:Georgia,'Times New Roman',serif; font-size:27px; line-height:1.25; font-weight:normal; color:#16233a;">
  {{titre}}
</h1>

<p style="margin:0 0 24px 0; font-size:15px; line-height:1.6; color:#8b93a3;">
  {{fournisseur}} &nbsp;·&nbsp; {{date}}
</p>

<p style="margin:0 0 22px 0;">
  {{message}}
</p>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="margin:0 0 26px 0; background-color:#faf7f2; border-radius:14px;">
  <tr>
    <td style="padding:20px 22px;">
      <div style="font-size:13px; font-weight:600; letter-spacing:0.07em; text-transform:uppercase; color:#8b93a3;">
        Détail
      </div>
      <div style="margin-top:10px; font-size:15px; line-height:1.8; color:#16233a;">
        {{detail}}
      </div>
    </td>
  </tr>
</table>

<p style="margin:0 0 22px 0; font-size:14px; line-height:1.6; color:#8b93a3;">
  L'état se suit en direct dans l'administration, onglet « Anthropic / OpenAI ».
</p>
