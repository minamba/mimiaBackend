<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="fr">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{titre}}</title>
  <!--
    Mise en page en tableaux et styles en ligne : Outlook rend le HTML avec le
    moteur de Word, qui ignore flexbox, grid, et une bonne partie des feuilles
    de style externes. Ce qui suit est laid en tant que HTML, et correct en
    tant que courrier.
  -->
</head>
<body style="margin:0; padding:0; background-color:#f4efe6; -webkit-font-smoothing:antialiased;">

  <!-- Texte de prévisualisation : ce que la boîte de réception affiche à côté
       de l'objet. Sans lui, elle y met le début du gabarit. -->
  <div style="display:none; max-height:0; overflow:hidden; opacity:0; color:transparent; height:0; width:0;">
    {{apercu}}
  </div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
         style="background-color:#f4efe6; padding:32px 12px;">
    <tr>
      <td align="center">

        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"
               style="width:600px; max-width:100%; background-color:#ffffff; border-radius:20px; overflow:hidden; box-shadow:0 2px 18px rgba(22,35,58,0.07);">

          <!-- en-tête -->
          <tr>
            <td align="center" style="padding:34px 32px 8px 32px;">
              <img src="cid:logoMimia" alt="Mimia" width="168"
                   style="display:block; width:168px; max-width:60%; height:auto; border:0;" />
            </td>
          </tr>

          <!-- filet de couleur -->
          <tr>
            <td style="padding:20px 32px 0 32px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td height="3" style="height:3px; background-color:#d63f1c; border-radius:2px; font-size:0; line-height:0;">&nbsp;</td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- contenu -->
          <tr>
            <td style="padding:28px 32px 34px 32px; font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif; font-size:16px; line-height:1.65; color:#16233a;">
              {{contenu}}
            </td>
          </tr>

        </table>

        <!-- pied -->
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"
               style="width:600px; max-width:100%;">
          <tr>
            <td align="center" style="padding:22px 24px 8px 24px; font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif; font-size:12.5px; line-height:1.6; color:#8b93a3;">
              Mimia — le professeur particulier de vos enfants<br />
              <a href="{{urlSite}}" style="color:#8b93a3; text-decoration:underline;">mimia.fr</a>
              &nbsp;·&nbsp; © {{annee}}
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:0 24px 26px 24px; font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif; font-size:11.5px; line-height:1.6; color:#a5abb8;">
              {{mentionPied}}
            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>

</body>
</html>
