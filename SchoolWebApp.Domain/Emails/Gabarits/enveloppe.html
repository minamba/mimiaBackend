<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="fr">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{titre}}</title>
  <!--
    TOUJOURS EN CLAIR, MÊME SUR UN TÉLÉPHONE EN THÈME SOMBRE (Camara, le
    18/10/2026 : « ça tue le design du mail »). Le mail se déclare clair
    uniquement (Apple Mail, Outlook) ; et ses fonds beige et blanc sont peints en
    dégradé, que Gmail n'inverse pas — essai B du 18/10, validé sur son iPhone.
  -->
  <meta name="color-scheme" content="light only" />
  <meta name="supported-color-schemes" content="light only" />
  <!--
    Mise en page en tableaux et styles en ligne : Outlook rend le HTML avec le
    moteur de Word, qui ignore flexbox, grid, et une bonne partie des feuilles
    de style externes. Ce qui suit est laid en tant que HTML, et correct en
    tant que courrier.
  -->
  <!--
    SUR TÉLÉPHONE (17/10/2026) : la carte de 600 px ne rétrécissait pas —
    `width:600px` l'emporte sur `max-width:100%` dans un tableau — et le bilan
    affiché sur le site débordait de l'écran. Sous 620 px, elle prend toute la
    largeur. Les messageries qui lisent ce bloc (Gmail, Apple Mail) en
    profitent ; les autres gardent la mise en page en ligne.
  -->
  <style type="text/css">
    :root { color-scheme: light only; supported-color-schemes: light only; }

    @media only screen and (max-width: 620px) {
      table[width="600"] { width: 100% !important; }
      img { max-width: 100% !important; height: auto !important; }
      td { word-break: break-word; }

      /* SUR TÉLÉPHONE (18/10/2026) : moins de marge sur les côtés de la carte,
         un logo de signature plus petit — l'adresse tient sur une ligne. */
      .carte-contenu { padding-left: 18px !important; padding-right: 18px !important; }
      .sig-logo { padding-right: 12px !important; }
      .sig-logo img { width: 76px !important; }
      .sig-texte { padding-left: 12px !important; word-break: normal !important; }
    }
  </style>
</head>
<body style="margin:0; padding:0; background-color:#f4efe6; background-image:linear-gradient(#f4efe6,#f4efe6); -webkit-font-smoothing:antialiased;">

  <!-- Texte de prévisualisation : ce que la boîte de réception affiche à côté
       de l'objet. Sans lui, elle y met le début du gabarit. -->
  <div style="display:none; max-height:0; overflow:hidden; opacity:0; color:transparent; height:0; width:0;">
    {{apercu}}
  </div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
         style="background-color:#f4efe6; background-image:linear-gradient(#f4efe6,#f4efe6); padding:32px 12px;">
    <tr>
      <td align="center">

        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"
               style="width:600px; max-width:100%; background-color:#ffffff; background-image:linear-gradient(#ffffff,#ffffff); border-radius:20px; overflow:hidden; box-shadow:0 2px 18px rgba(22,35,58,0.07);">

          <!-- en-tête : la bannière en pleine largeur, jusqu'aux coins arrondis
               de la carte (`overflow:hidden` posé plus haut). Elle porte son
               propre fond sombre — d'où le padding à zéro : un padding ici
               laisserait un liseré blanc tout autour, et « bannière » n'en
               serait plus une. -->
          <tr>
            <td align="center" style="padding:0; line-height:0; font-size:0;">
              <img src="cid:logoMimia" alt="Mimia — mimia.fr" width="600" height="197"
                   style="display:block; width:100%; max-width:600px; height:auto; border:0;" />
            </td>
          </tr>

          <!-- filet de couleur — largeur forcée (18/10/2026) : Gmail sur téléphone le
               réduisait à un point. -->
          <tr>
            <td style="padding:20px 32px 0 32px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td height="3" width="100%" style="width:100%; height:3px; background-color:#d63f1c; border-radius:2px; font-size:0; line-height:0;">&nbsp;</td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- contenu -->
          <tr>
            <td class="carte-contenu" style="padding:28px 32px 34px 32px; font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif; font-size:16px; line-height:1.65; color:#16233a;">
              {{contenu}}
            </td>
          </tr>

        </table>

        <!-- pied -->
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"
               style="width:600px; max-width:100%;">
          <tr>
            <td align="center" style="padding:22px 24px 8px 24px; font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif; font-size:12.5px; line-height:1.6; color:#8b93a3;">
              Mimia — le professeur particulier de vos enfants<br />
              <a href="{{urlSite}}" style="color:#8b93a3; text-decoration:underline;">mimia.fr</a>
              &nbsp;·&nbsp; © {{annee}}
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:0 24px 26px 24px; font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif; font-size:11.5px; line-height:1.6; color:#a5abb8;">
              {{mentionPied}}
            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>

</body>
</html>
