<h1 style="margin:0 0 6px 0; font-family:Georgia,'Times New Roman',serif; font-size:27px; line-height:1.25; font-weight:normal; color:#16233a;">
  {{titre}}
</h1>

<p style="margin:0 0 24px 0; font-size:15px; line-height:1.6; color:#8b93a3;">
  Formule {{offre}} &nbsp;·&nbsp; le {{date}}
</p>

<!-- LE MOTIF EN PREMIER, AVANT LE CHIFFRE.
     Un parent qui voit son solde bouger se demande POURQUOI avant de se
     demander de combien. Un courriel qui annonce le montant puis explique se
     lit comme une notification comptable ; celui-ci doit se lire comme une
     phrase qu'on lui adresse. -->
<p style="margin:0 0 22px 0;">
  {{explication}}
</p>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="margin:0 0 26px 0; background-color:#faf7f2; border-radius:14px;">
  <tr>
    <td style="padding:20px 22px;">
      <div style="font-size:13px; font-weight:600; letter-spacing:0.07em; text-transform:uppercase; color:#8b93a3;">
        Votre forfait
      </div>
      <div style="margin-top:10px; font-size:15px; line-height:1.8; color:#16233a;">
        {{mouvement}}<br>
        Il vous reste <strong>{{restantes}}</strong> jusqu'au {{renouvellement}}.
      </div>
    </td>
  </tr>
</table>

<p style="margin:0 0 24px 0;">
  Une question sur ce changement&nbsp;? Répondez simplement à ce message, nous
  vous répondrons.
</p>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 8px 0;">
  <tr>
    <td style="border-radius:999px; background-color:#d63f1c;">
      <a href="{{lien}}"
         style="display:inline-block; padding:13px 28px; font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif; font-size:15px; font-weight:600; color:#ffffff; text-decoration:none;">
        Voir mon forfait
      </a>
    </td>
  </tr>
</table>
