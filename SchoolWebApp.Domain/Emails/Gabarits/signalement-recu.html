<h1 style="margin:0 0 6px 0; font-family:Georgia,'Times New Roman',serif; font-size:27px; line-height:1.25; font-weight:normal; color:#16233a;">
  Votre signalement a bien été reçu
</h1>

<p style="margin:0 0 22px 0; font-size:16px; line-height:1.65; color:#5f6c81;">
  Il sera traité par l'équipe mimia.fr.
</p>

<!-- Le thème et le message, en tableau : comme sur le gabarit de contact,
     les listes de définition sont rendues de façon erratique d'un client de
     messagerie à l'autre. -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="margin:0 0 24px 0; background-color:#faf7f2; border-radius:14px;">
  <tr>
    <td style="padding:20px 22px; font-size:15px; line-height:1.8; color:#16233a;">
      <strong style="color:#d63f1c;">Thème&nbsp;:</strong>&nbsp; {{theme}}
    </td>
  </tr>
</table>

<p style="margin:0 0 8px 0; font-size:13px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:#5f6c81;">
  Votre message
</p>

<!-- `white-space: pre-wrap` conserve les retours à la ligne saisis dans la
     popup « Signaler ». -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="margin:0 0 26px 0; border-left:3px solid #d63f1c;">
  <tr>
    <td style="padding:4px 0 4px 18px; font-size:16px; line-height:1.7; color:#16233a; white-space:pre-wrap;">{{description}}</td>
  </tr>
</table>

<p style="margin:0; font-size:14px; line-height:1.6; color:#5f6c81;">
  Nous revenons vers vous sous 24 à 48h — un peu plus si le sujet demande
  davantage d'investigation. Vous recevrez un nouveau message à chaque
  étape du traitement.
</p>
