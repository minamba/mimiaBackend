<!-- LA RÉPONSE DU SUPPORT, DANS L'ENVELOPPE HABITUELLE.
     Un parent qui a reçu un mot de bienvenue et des bilans aux couleurs de
     Mimia recevrait sinon une réponse en texte nu : il douterait de qui lui
     écrit, et c'est exactement le réflexe qu'on veut lui laisser face aux
     vraies tentatives d'usurpation. -->

<p style="margin:0 0 20px 0; font-size:15px; line-height:1.7; color:#16233a;">
  {{salutation}}
</p>

{{corpsReponse}}

<!-- LA SIGNATURE EST FIXE, ET C'EST TOUT SON INTÉRÊT.
     Sans elle, une réponse de deux lignes ressemble à un message écrit à la
     hâte depuis un téléphone — alors que c'est le support d'un service payant
     qui répond. Le bloc coûte trois lignes et change ce que le message dit de
     l'entreprise. -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:26px 0 0 0;">
  <tr>
    <td style="font-size:15px; line-height:1.7; color:#16233a;">
      Bien à vous,<br />
      <strong>L'équipe Mimia</strong>
    </td>
  </tr>
</table>

<!-- « RÉPONDEZ DIRECTEMENT » N'EST PAS UNE FORMULE DE POLITESSE.
     Beaucoup de services écrivent depuis une adresse qui n'accepte aucune
     réponse ; le parent a appris à ne pas répondre, et sa relance se perd
     dans un formulaire qu'il ne retrouve pas. On le dit, parce que chez nous
     c'est vrai : cette adresse est lue. -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="margin:26px 0 0 0; background-color:#faf7f2; border-radius:14px;">
  <tr>
    <td style="padding:16px 20px; font-size:13.5px; line-height:1.6; color:#8b93a3;">
      Une question de plus&nbsp;? <strong style="color:#16233a;">Répondez
      directement à ce message</strong> — il arrive dans notre boîte, et nous
      vous répondrons.
    </td>
  </tr>
</table>

<!-- LE MESSAGE D'ORIGINE, REPRIS EN DESSOUS.
     Les clients de messagerie ne montrent pas toujours le fil ; sans ce rappel,
     un parent qui écrit trois fois dans la semaine ne sait pas à laquelle de
     ses questions on répond. Grisé et en retrait, comme partout ailleurs. -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="margin:28px 0 0 0; border-top:1px solid #e4ded3;">
  <tr>
    <td style="padding:18px 0 0 0;">
      <div style="font-size:12.5px; color:#8b93a3;">
        Le {{dateOrigine}}, vous nous écriviez&nbsp;:
      </div>
      <div style="margin-top:8px; padding-left:14px; border-left:3px solid #e4ded3;
                  font-size:14px; line-height:1.6; color:#8b93a3;">
        {{messageOrigine}}
      </div>
    </td>
  </tr>
</table>
